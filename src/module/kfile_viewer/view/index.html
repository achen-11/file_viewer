  <script>
    tailwind.config = { darkMode: 'class' };
    (function syncKoobooDarkMode() {
      var THEME_ATTRS = ['class', 'data-theme', 'data-color-mode', 'data-bs-theme'];
      function elementImpliesDark(el) {
        if (!el) return null;
        if (el.classList.contains('dark') || el.classList.contains('dark-mode')) return true;
        var theme = el.getAttribute('data-theme') || el.getAttribute('data-color-mode') || el.getAttribute('data-bs-theme');
        if (theme === 'dark') return true;
        if (theme === 'light') return false;
        return null;
      }
      function detectKoobooDark() {
        var explicitDark = false;
        var explicitLight = false;
        var seen = new Set();
        function walk(win) {
          if (!win || seen.has(win)) return;
          seen.add(win);
          try {
            [win.document.documentElement, win.document.body].forEach(function (el) {
              var state = elementImpliesDark(el);
              if (state === true) explicitDark = true;
              if (state === false) explicitLight = true;
            });
          } catch (_) { }
          try {
            if (win.parent && win.parent !== win) walk(win.parent);
          } catch (_) { }
        }
        walk(window);
        if (explicitDark) return true;
        if (explicitLight) return false;
        try {
          var stored = localStorage.getItem('theme') || localStorage.getItem('color-mode') || localStorage.getItem('vueuse-color-scheme');
          if (stored === 'dark') return true;
          if (stored === 'light') return false;
        } catch (_) { }
        var embedded = false;
        try { embedded = window.parent && window.parent !== window; } catch (_) { embedded = true; }
        if (embedded) return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function apply() {
        document.documentElement.classList.toggle('dark', detectKoobooDark());
      }
      function observeThemeRoots() {
        var observed = new WeakSet();
        function observeEl(el) {
          if (!el || observed.has(el)) return;
          observed.add(el);
          try {
            new MutationObserver(apply).observe(el, { attributes: true, attributeFilter: THEME_ATTRS });
          } catch (_) { }
        }
        var seen = new Set();
        function walk(win) {
          if (!win || seen.has(win)) return;
          seen.add(win);
          try {
            observeEl(win.document.documentElement);
            observeEl(win.document.body);
          } catch (_) { }
          try {
            if (win.parent && win.parent !== win) walk(win.parent);
          } catch (_) { }
        }
        walk(window);
      }
      apply();
      observeThemeRoots();
      window.addEventListener('storage', function (e) {
        if (e.key && /theme|color|scheme/i.test(e.key)) apply();
      });
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
      }
    })();
  </script>

  <script env="server">
    function ensureHttps(url) {
      return url.startsWith('http:') ? 'https:' + url.slice(5) : url
    }
    const moduleBase = ensureHttps(k.module.baseUrl).replace(/\/$/, '')
    const apiBaseUrl = moduleBase + '/api/files'
    const sitePublicUrl = k.site.info.makeAbsUrl('/').replace(/\/$/, '')
    k.utils.clientJS.setVariable("baseUrl", { value: apiBaseUrl })
    k.utils.clientJS.setVariable("sitePublicUrl", { value: sitePublicUrl })
  </script>
  <script>
    /* 
    针对kooboo的vue组件注册
     
    组件使用以下方法会自动注册该组件, 减少重复配置components
    defineComponent('my-component', {...})
    */
    var { definePage, defineComponent, getComponents } = (() => {
      const components = {}

      return {
        /**
         * definePage
         * @param {object} component vue组件
         */
        definePage(component) {
          const key = 'main-component'
          if (components[key]) {
            console.warn(`components ${key} multiple registration`)
          }
          components[key] = { ...component, template: '#main-component' }
          return components[key]
        },
        /**
         * defineComponent
         * @param {string} key 组件名称
         * @param {object} component vue组件
         */
        defineComponent(key, component) {
          if (components[key]) {
            console.warn(`components ${key} multiple registration`)
          }
          components[key] = component
          return components[key]
        },
        /**
         * getComponents
         * @param {string} key 组件名称
         * @return {{[key:string]: any}[]} 所有组件
         */
        getComponents() {
          return components
        }

      }
    })()

    /**
     *  vue 常用方法扁平化
     */
    var { getCurrentInstance, ref, reactive, watch, computed,
      onMounted, onUnmounted, nextTick, unref, toRef, toRaw, provide, inject, toValue } = Vue


  </script>

<body class="bg-slate-100 text-slate-900 dark:bg-[#252526] dark:text-neutral-200 min-h-screen">
  <div id="app" class="flex flex-col h-screen">
    <router-view>
    </router-view>
  </div>
  <view id="entrance"></view>
  <view id="app-header"></view>
  <view id="file-tree"></view>
  <view id="file-list"></view>
  <view id="preview-panel"></view>
  <view id="modals"></view>
  <view id="test-view"></view>
  <script>
    const app = Vue.createApp({
      setup() { return {} }
    })
    for (const [key, component] of Object.entries(getComponents())) {
      app.component(key, component)
    }
    const { createWebHashHistory, createRouter } = VueRouter
    const routes = [
      { path: '/', component: getComponents()['main-component'], name: 'file-viewer' },
      { path: '/test', component: getComponents()['kfile-viewer-test-view'], name: 'test' },
      { path: '/:pathMatch(.*)*', component: getComponents()['main-component'], name: 'fallback' }
    ]
    var router = createRouter({
      history: createWebHashHistory(),
      routes
    })
    app.use(router).mount("#app")
  </script>
